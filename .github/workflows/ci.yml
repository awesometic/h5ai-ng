name: ci
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node test/bundle.js

  php:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-24.04
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -d error_reporting=E_ALL -l

  docker:
    name: Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            qemu: false
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            qemu: false
          - platform: linux/arm/v7
            runner: ubuntu-24.04
            qemu: true
          - platform: linux/arm/v6
            runner: ubuntu-24.04
            qemu: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        if: matrix.qemu
        with:
          platforms: arm
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          pull: true
          load: true
          tags: h5ai-ng:test
      - run: python3 docker/smoke.py h5ai-ng:test "${{ matrix.platform }}"

  publish:
    name: Publish image
    needs: [build, php, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check tag against package.json and CHANGELOG.md
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(node -p 'require("./package.json").version')"
          # the release notes come from this section, so it must carry a date, not *unreleased*
          grep -q "^## v$version - \*[0-9]" CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,arm
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6
          pull: true
          push: true
          tags: |
            awesometic/h5ai-ng:${{ steps.version.outputs.version }}
            awesometic/h5ai-ng:latest

  release:
    name: GitHub release
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run release
      - name: Write release notes from the template and CHANGELOG.md
        run: |
          python3 - "${GITHUB_REF_NAME#v}" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          log = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(rf'^## v{re.escape(version)} .*?\n(.*?)(?=^## |\Z)', log, re.S | re.M)
          if not m:
              sys.exit(f'CHANGELOG.md has no v{version} section')
          tpl = open('.github/release-template.md', encoding='utf-8').read()
          print(tpl.replace('{{version}}', version).replace('{{changes}}', m.group(1).strip()), end='')
          PY
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "build/h5ai-$version.zip" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "h5ai-ng $version" --notes-file notes.md
