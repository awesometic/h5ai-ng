server {
    listen  80 default_server;
    listen  [::]:80 default_server;
    server_name _;
    # relative redirects keep the host port and a reverse proxy's path
    absolute_redirect off;

    root /h5ai;
    index index.html index.htm index.php /_h5ai/public/index.php;

    # h5ai
    location ^~ /_h5ai/ {
        root /usr/share/h5ai/;

        # config and caches are read by PHP only; nginx ignores the .htaccess guard.
        # ^~ on both locations keeps the server-level PHP handler from serving them
        location ^~ /_h5ai/private/ {
            deny all;
        }

        # pass the index.php to FastCGI server listening on 127.0.0.1:9000
        location ~ [^/]\.php(/|$) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;

            fastcgi_pass   127.0.0.1:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param  HTTP_PROXY "";
            include        fastcgi_params;
            fastcgi_param  SCRIPT_NAME $h5ai_prefix$fastcgi_script_name;
            fastcgi_param  REQUEST_URI $h5ai_prefix$request_uri;
        }
    }

    # redirect server error pages to the static page /50x.html
    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    # Remain this for compatibility of PHP sub pages
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;

        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param  HTTP_PROXY "";
        include        fastcgi_params;
        fastcgi_param  SCRIPT_NAME $h5ai_prefix$fastcgi_script_name;
        fastcgi_param  REQUEST_URI $h5ai_prefix$request_uri;
    }

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    location ~ /\.ht {
        deny  all;
    }

    # For letsencrypt
    location /.well-known/acme-challenge/ {
        alias /var/www/challenges/;
        try_files $uri =404;
    }
}

# A reverse proxy that serves h5ai under a path such as /share/ strips it and
# names it in X-Forwarded-Prefix, so PHP builds links with it.
# Only a plain path is taken; anything else is ignored.
map $http_x_forwarded_prefix $h5ai_prefix {
    default                             "";
    "~^(?<p>(/[A-Za-z0-9_~-][A-Za-z0-9._~-]*)+)/?$" $p;
}
